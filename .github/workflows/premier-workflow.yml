name: Mon premier workflow

# Déclenchement du workflow
on:
  push:

# Définition des tâches
job:
  premier-job:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher un message
        run: echo "Bienvenue dans le cours DevOps"

      - name: Afficher la date
        run: date

      - name: Afficher le système
        run: uname -a

      # Exercice 2
      - name: Nom du projet
        run: echo "Projet TP DevOps"

      # Exercice 3 (remplacez VOTRE NOM par votre vrai nom)
      - name: Afficher mon nom et la date d'exécution
        run: |
          echo "Nom : VOTRE NOM"
          echo "Date d'exécution : $(date)"
